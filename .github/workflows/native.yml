name: release PanVK for Termux (aarch64, native)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        type: choice
        required: true
        default: both
        options:
          - both
          - debugoptimized
          - release
      release_tag:
        description: "Tag to create (leave empty to auto-generate)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      date:  ${{ steps.ts.outputs.date }}
      time:  ${{ steps.ts.outputs.time }}
      stamp: ${{ steps.ts.outputs.stamp }}
      tag:   ${{ steps.ts.outputs.tag }}
      types: ${{ steps.ts.outputs.types }}
    steps:
      - name: Compute build timestamp and tag
        id: ts
        run: |
          DATE=$(date -u +'%Y-%m-%d')
          TIME=$(date -u +'%H%M%S')
          STAMP="${DATE}-${TIME}"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "date=$DATE"           >> "$GITHUB_OUTPUT"
          echo "time=$TIME"           >> "$GITHUB_OUTPUT"
          echo "stamp=$STAMP"         >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${{ github.event.inputs.release_tag }}" ]]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="build-${DATE}-${TIME}-${SHORT_SHA}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          CHOICE="${{ github.event.inputs.build_type }}"
          case "$CHOICE" in
            release)        TYPES='["release"]' ;;
            debugoptimized) TYPES='["debugoptimized"]' ;;
            *)              TYPES='["debugoptimized","release"]' ;;
          esac
          echo "types=$TYPES" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        build-type: ${{ fromJSON(needs.prepare.outputs.types) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PanVK (${{ matrix.build-type }}) inside Termux container
        run: |
          set -euo pipefail

          mkdir -p "${{ github.workspace }}/termux-out-${{ matrix.build-type }}"
          chmod 777 "${{ github.workspace }}/termux-out-${{ matrix.build-type }}"

          docker run --rm \
            -v "${{ github.workspace }}/termux-out-${{ matrix.build-type }}:/termux-out" \
            termux/termux-docker:aarch64 \
            bash -c '
              set -euo pipefail
              export TMPDIR="${TMPDIR:-$PREFIX/tmp}"
              export BUILD_TYPE="'"${{ matrix.build-type }}"'"

              mkdir -p "$PREFIX/etc/apt/sources.list.d"
              echo "deb https://packages.termux.dev/apt/termux-main stable main" \
                > "$PREFIX/etc/apt/sources.list.d/termux-main.list"

              for i in 1 2 3; do
                if pkg update -y; then
                  break
                fi
                echo "pkg update attempt $i failed, retrying in 10s..."
                sleep 10
                if [[ $i -eq 3 ]]; then
                  echo "pkg update failed after 3 attempts" >&2
                  exit 1
                fi
              done

              pkg install -y x11-repo tur-repo
              pkg update -y || true

              pkg install -y \
                git clang lld ninja python python-pip pkg-config \
                bison flex cmake glslang shaderc vulkan-headers \
                vulkan-loader-generic libandroid-shmem libdrm libxcb \
                xorgproto libx11 libxshmfence zlib zstd libexpat \
                libclc spirv-llvm-translator libxrandr libxrandr-static file \
                patch

              pip install --break-system-packages meson mako pyyaml packaging

              mkdir -p "$TMPDIR"
              cd "$TMPDIR"
              rm -rf mesa-panvk
              git clone --depth 1 https://github.com/xodiosx/mesa-funnymdz-leegao.git mesa-panvk
              cd mesa-panvk

              echo "=============================================="
              echo "Applying panvk-mali-g57-workaround.patch ..."
              echo "=============================================="
              if [[ ! -f panvk-mali-g57-workaround.patch ]]; then
                echo "ERROR: panvk-mali-g57-workaround.patch not found in repo root" >&2
                ls -la
                exit 1
              fi

              if git apply --check panvk-mali-g57-workaround.patch 2>/dev/null; then
                echo ">>> git apply --check passed; applying cleanly"
                git apply --verbose panvk-mali-g57-workaround.patch
              else
                echo ">>> git apply --check failed; falling back to patch -p1 --forward"
                patch -p1 --forward --no-backup-if-mismatch \
                  < panvk-mali-g57-workaround.patch || true
                echo ">>> patch(1) returned non-zero (expected if some hunks were skipped)"
              fi

              echo "--- reject files ---"
              find . -name "*.rej" -print || true
              echo "--- end reject files ---"

              echo "=============================================="
              echo "Sanity check: critical patch content present ..."
              echo "=============================================="
              if grep -q "exec_init_failed" src/panfrost/lib/kmod/pan_kmod.h && \
                 grep -q "exec_init_failed" src/panfrost/lib/kmod/kbase_kmod.c && \
                 grep -q "mempools.rw"    src/panfrost/vulkan/panvk_vX_shader.c; then
                echo ">>> PASS: exec_init_failed field and shader fallback are in the tree"
              else
                echo ">>> FAIL: critical patch content missing; cannot build" >&2
                grep -n "exec_init_failed" src/panfrost/lib/kmod/pan_kmod.h   || echo "missing in pan_kmod.h"
                grep -n "exec_init_failed" src/panfrost/lib/kmod/kbase_kmod.c || echo "missing in kbase_kmod.c"
                grep -n "mempools.rw"      src/panfrost/vulkan/panvk_vX_shader.c || echo "missing in panvk_vX_shader.c"
                exit 1
              fi

              # ── Probe available Meson options ──
              echo "=============================================="
              echo "Probing available Meson options ..."
              echo "=============================================="
              OPTIONS_FILE="meson.options"
              [[ -f "$OPTIONS_FILE" ]] || OPTIONS_FILE="meson_options.txt"
              echo "Options file: $OPTIONS_FILE"
              grep -oE "option\([^a-zA-Z0-9_-]+[a-z0-9_-]+" "$OPTIONS_FILE" \
                | sed -E "s/option\([^a-zA-Z0-9_-]+//" | sort -u | tr "\n" " " || true
              echo

              has_option() {
                grep -qE "option\([^a-zA-Z0-9_-]+$1[^a-zA-Z0-9_-]" "$OPTIONS_FILE"
              }

              MESON_ARGS=(
                "-Dbuildtype=$BUILD_TYPE"
                "-Dvulkan-drivers=panfrost"
                "-Dgallium-drivers="
                "-Dplatforms=x11"
                "-Dglx=disabled"
                "-Degl=disabled"
                "-Dopengl=false"
                "-Dgles1=disabled"
                "-Dgles2=disabled"
                "-Dbuild-tests=false"
                "-Dlibunwind=disabled"
                "-Dvalgrind=disabled"
                "-Dperfetto=false"
                "-Dprefix=$PREFIX"
                "-Dc_link_args=-landroid-shmem"
                "-Dcpp_link_args=-landroid-shmem"
              )

              if has_option "panfrost-kmds"; then
                MESON_ARGS+=("-Dpanfrost-kmds=kbase,panthor")
                echo ">>> panfrost-kmds supported; adding kbase,panthor"
              fi
              if has_option "panvk-use-kbase"; then
                MESON_ARGS+=("-Dpanvk-use-kbase=true")
                echo ">>> panvk-use-kbase supported; enabling"
              else
                echo ">>> panvk-use-kbase not present in this repo (likely default)"
              fi
              if has_option "panfrost-rust"; then
                MESON_ARGS+=("-Dpanfrost-rust=false")
              fi

              echo "=============================================="
              echo "meson setup with: ${MESON_ARGS[*]}"
              echo "=============================================="
              meson setup build-bionic "${MESON_ARGS[@]}"

              ninja -C build-bionic -j$(nproc) \
                src/panfrost/vulkan/libvulkan_panfrost.so

              mkdir -p /termux-out/lib
              mkdir -p /termux-out/share/vulkan/icd.d

              cp build-bionic/src/panfrost/vulkan/libvulkan_panfrost.so \
                 /termux-out/lib/libvulkan_panfrost.so

              cat > /termux-out/share/vulkan/icd.d/panfrost_icd.aarch64.json <<JSON
              {
                  "ICD": {
                      "api_version": "1.4.354",
                      "library_arch": "64",
                      "library_path": "$PREFIX/lib/libvulkan_panfrost.so"
                  },
                  "file_format_version": "1.0.1"
              }
              JSON

              echo "=== ICD ==="
              cat /termux-out/share/vulkan/icd.d/panfrost_icd.aarch64.json
              echo "=== /termux-out ==="
              find /termux-out -type f
              echo "=== sizes ==="
              ls -lh /termux-out/lib/
            '

      - name: Package tarball (${{ matrix.build-type }})
        run: |
          set -euo pipefail
          cd "termux-out-${{ matrix.build-type }}"
          TARBALL="panvk-termux-aarch64-${{ matrix.build-type }}-${{ needs.prepare.outputs.stamp }}.tar.gz"
          tar -czvf "../${TARBALL}" .
          ls -lh "../${TARBALL}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: panvk-termux-aarch64-${{ matrix.build-type }}-${{ needs.prepare.outputs.stamp }}
          path: |
            termux-out-${{ matrix.build-type }}/
            panvk-termux-aarch64-${{ matrix.build-type }}-${{ needs.prepare.outputs.stamp }}.tar.gz
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded files
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "${{ needs.prepare.outputs.tag }} — PanVK build ${{ needs.prepare.outputs.date }} ${{ needs.prepare.outputs.time }} UTC"
          body: |
            ## PanVK for Termux (aarch64, native build)

            Built natively inside Termux (`termux/termux-docker:aarch64`)
            on `ubuntu-24.04-arm`.

            **Source:** `xodiosx/mesa-funnymdz-leegao`
            **Build date (UTC):** `${{ needs.prepare.outputs.date }}`
            **Build time (UTC):** `${{ needs.prepare.outputs.time }}`
            **Commit:** `${{ github.sha }}`
            **Build types:** `${{ needs.prepare.outputs.types }}`

            ### Build customizations
            - `panvk-mali-g57-workaround.patch` applied from repo root
              (tolerant application; critical hunks verified in-tree).
            - Includes `exec_init_failed` fallback for Mali-G57 (arch 9, JM).
            - Meson options are probed at configure time so the workflow
              adapts to whichever options the repo actually exposes.

            ### Files
            - `panvk-termux-aarch64-debugoptimized-*.tar.gz`
            - `panvk-termux-aarch64-release-*.tar.gz`
            - `libvulkan_panfrost.so`
            - `panfrost_icd.aarch64.json`

            ### Install (Termux)
            ```bash
            tar -xzf panvk-termux-aarch64-release-*.tar.gz -C $PREFIX
            export VK_ICD_FILENAMES=$PREFIX/share/vulkan/icd.d/panfrost_icd.aarch64.json
            ```
          files: |
            artifacts/*.tar.gz
            artifacts/**/libvulkan_panfrost.so
            artifacts/**/panfrost_icd.aarch64.json
          overwrite_files: true
          generate_release_notes: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
