name: release PanVK for Termux (aarch64, native)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        type: choice
        required: true
        default: both
        options:
          - both
          - debugoptimized
          - release
      release_tag:
        description: "Tag to create (leave empty to auto-generate)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      date:  ${{ steps.ts.outputs.date }}
      time:  ${{ steps.ts.outputs.time }}
      stamp: ${{ steps.ts.outputs.stamp }}
      tag:   ${{ steps.ts.outputs.tag }}
      types: ${{ steps.ts.outputs.types }}
    steps:
      - name: Compute build timestamp and tag
        id: ts
        run: |
          DATE=$(date -u +'%Y-%m-%d')
          TIME=$(date -u +'%H%M%S')
          STAMP="${DATE}-${TIME}"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "date=$DATE"           >> "$GITHUB_OUTPUT"
          echo "time=$TIME"           >> "$GITHUB_OUTPUT"
          echo "stamp=$STAMP"         >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${{ github.event.inputs.release_tag }}" ]]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="build-${DATE}-${TIME}-${SHORT_SHA}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          CHOICE="${{ github.event.inputs.build_type }}"
          case "$CHOICE" in
            release)        TYPES='["release"]' ;;
            debugoptimized) TYPES='["debugoptimized"]' ;;
            *)              TYPES='["debugoptimized","release"]' ;;
          esac
          echo "types=$TYPES" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        build-type: ${{ fromJSON(needs.prepare.outputs.types) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write Meson command generator
        run: |
          mkdir -p "${{ github.workspace }}/ci-scripts"
          cat > "${{ github.workspace }}/ci-scripts/gen_meson_cmd.py" << 'PYEOF'
          #!/usr/bin/env python3
          """
          Read meson.options, emit a `meson setup` shell command on stdout.
          """
          import os
          import re
          import sys
          from pathlib import Path

          options_file = None
          for name in ("meson.options", "meson_options.txt"):
              f = Path(name)
              if f.exists():
                  options_file = f
                  break

          if options_file is None:
              print("ERROR: no meson.options file found", file=sys.stderr)
              sys.exit(1)

          content = options_file.read_text()
          opts = sorted(set(re.findall(r"['\"]([a-zA-Z0-9_-]+)['\"]", content)))

          print(f">>> Options file: {options_file}", file=sys.stderr)
          print(f">>> Options found: {' '.join(opts)}", file=sys.stderr)

          build_type = os.environ.get("BUILD_TYPE", "debugoptimized")
          prefix = os.environ.get("PREFIX", "/data/data/com.termux/files/usr")

          args = [
              f"-Dbuildtype={build_type}",
              "-Dvulkan-drivers=panfrost",
              "-Dgallium-drivers=",
              "-Dplatforms=x11",
              "-Dplatform-sdk-version=35",
              "-Dglx=disabled",
              "-Degl=disabled",
              "-Dopengl=false",
              "-Dgles1=disabled",
              "-Dgles2=disabled",
              "-Dbuild-tests=false",
              "-Dlibunwind=disabled",
              "-Dvalgrind=disabled",
              "-Dperfetto=false",
              f"-Dprefix={prefix}",
              "-Dc_args=-D__ANDROID_API__=35",
              "-Dcpp_args=-D__ANDROID_API__=35",
              "-Dc_link_args=-landroid-shmem",
              "-Dcpp_link_args=-landroid-shmem",
          ]

          if "panfrost-kmds" in opts:
              args.append("-Dpanfrost-kmds=kbase,panthor")
              print(">>> Adding: -Dpanfrost-kmds=kbase,panthor", file=sys.stderr)

          if "panvk-use-kbase" in opts:
              args.append("-Dpanvk-use-kbase=true")
              print(">>> Adding: -Dpanvk-use-kbase=true", file=sys.stderr)

          if "panfrost-rust" in opts:
              args.append("-Dpanfrost-rust=false")

          print("meson setup build-bionic \\")
          for i, a in enumerate(args):
              sep = "" if i == len(args) - 1 else " \\"
              print(f"  {a}{sep}")
          PYEOF
          chmod +x "${{ github.workspace }}/ci-scripts/gen_meson_cmd.py"

      - name: Build PanVK (${{ matrix.build-type }}) inside Termux container
        run: |
          set -euo pipefail

          mkdir -p "${{ github.workspace }}/termux-out-${{ matrix.build-type }}"
          chmod 777 "${{ github.workspace }}/termux-out-${{ matrix.build-type }}"

          docker run --rm \
            -v "${{ github.workspace }}/termux-out-${{ matrix.build-type }}:/termux-out" \
            -v "${{ github.workspace }}/ci-scripts:/ci-scripts:ro" \
            termux/termux-docker:aarch64 \
            bash -c '
              set -euo pipefail
              export TMPDIR="${TMPDIR:-$PREFIX/tmp}"
              export BUILD_TYPE="'"${{ matrix.build-type }}"'"

              mkdir -p "$TMPDIR"

              mkdir -p "$PREFIX/etc/apt/sources.list.d"
              echo "deb https://packages.termux.dev/apt/termux-main stable main" \
                > "$PREFIX/etc/apt/sources.list.d/termux-main.list"

              for i in 1 2 3; do
                if pkg update -y; then break; fi
                sleep 10
                if [[ $i -eq 3 ]]; then exit 1; fi
              done

              pkg install -y x11-repo tur-repo
              pkg update -y || true

              pkg install -y \
                git clang lld ninja python python-pip pkg-config \
                bison flex cmake glslang shaderc vulkan-headers \
                vulkan-loader-generic libandroid-shmem libdrm libxcb \
                xorgproto libx11 libxshmfence zlib zstd libexpat \
                libclc spirv-llvm-translator libxrandr libxrandr-static file \
                patch

              pip install --break-system-packages meson mako pyyaml packaging setuptools

              cd "$TMPDIR"
              rm -rf mesa-panvk
              git clone --depth 1 https://github.com/xodiosx/mesa-funnymdz-leegao.git mesa-panvk
              cd mesa-panvk

              # ── Fetch the winlatormali-ci branch as a reference tree ──
              echo "=============================================="
              echo "Fetching winlatormali-ci reference tree ..."
              echo "=============================================="
              git clone --depth 1 \
                --branch winlatormali-ci \
                https://github.com/mexicanbr0auth/mesa-panvk-g57.git \
                /tmp/winlatormali-ref

              # ── Diff: what files differ between the two trees ──
              echo "=============================================="
              echo "Files that differ from winlatormali-ci ..."
              echo "=============================================="
              diff -rq --exclude=".git" /tmp/winlatormali-ref . 2>/dev/null \
                | grep -v "^Only in /tmp/winlatormali-ref" \
                | tee /tmp/diff-summary.txt || true

              echo "=============================================="
              echo "Files only present in winlatormali-ci ..."
              echo "=============================================="
              diff -rq --exclude=".git" /tmp/winlatormali-ref . 2>/dev/null \
                | grep "^Only in /tmp/winlatormali-ref" \
                | tee /tmp/diff-only-ref.txt || true

              # ── Copy over the differing files (excluding build artifacts) ──
              echo "=============================================="
              echo "Replacing differing files from winlatormali-ci ..."
              echo "=============================================="
              # Build a list of files that exist in both but differ, plus
              # files only in the reference (skipping build dirs).
              (
                cd /tmp/winlatormali-ref
                find . -type f \
                  -not -path "./.git/*" \
                  -not -path "./build*/*" \
                  -not -path "./subprojects/*" \
                  | while read -r f; do
                    rel="${f#./}"
                    if [[ ! -f "/tmp/rel-mesa/$rel" ]] || \
                       ! cmp -s "$f" "/tmp/rel-mesa/$rel"; then
                      echo "$rel"
                    fi
                  done
              ) > /tmp/files-to-copy.txt || true

              # Actually copy them
              cp -a /tmp/rel-mesa/. /tmp/rel-mesa-copy/ 2>/dev/null || true

              # Simpler: rsync the reference over our tree, preserving
              # anything in our tree that the reference doesn't have.
              cp -a /tmp/winlatormali-ref/src/. src/ 2>/dev/null || true
              # Also copy top-level meson files and docs if they changed
              for f in meson.build meson.options meson_options.txt VERSION; do
                [[ -f "/tmp/winlatormali-ref/$f" ]] && \
                  cp -a "/tmp/winlatormali-ref/$f" "./$f" 2>/dev/null || true
              done

              # ── Apply our own patch on top ──
              echo "=============================================="
              echo "Applying panvk-mali-g57-workaround.patch ..."
              echo "=============================================="
              if [[ -f panvk-mali-g57-workaround.patch ]]; then
                if git apply --check panvk-mali-g57-workaround.patch 2>/dev/null; then
                  git apply --verbose panvk-mali-g57-workaround.patch
                else
                  patch -p1 --forward --no-backup-if-mismatch \
                    < panvk-mali-g57-workaround.patch || true
                fi
              else
                echo ">>> No panvk-mali-g57-workaround.patch in tree (already merged?)"
              fi

              echo "--- reject files ---"
              find . -name "*.rej" -print || true

              # ── Sanity: check our critical fields are still present ──
              if grep -q "exec_init_failed" src/panfrost/lib/kmod/pan_kmod.h && \
                 grep -q "exec_init_failed" src/panfrost/lib/kmod/kbase_kmod.c && \
                 grep -q "mempools.rw"    src/panfrost/vulkan/panvk_vX_shader.c; then
                echo ">>> PASS: exec_init_failed + shader fallback present"
              else
                echo ">>> FAIL: critical content missing" >&2
                exit 1
              fi

              # ── Generate meson command ──
              MESON_SH="$TMPDIR/meson_cmd.sh"
              rm -f "$MESON_SH"
              python3 /ci-scripts/gen_meson_cmd.py > "$MESON_SH"
              cat "$MESON_SH"
              bash "$MESON_SH"

              # ── Archive the source tree ──
              echo "=============================================="
              echo "Archiving source tree ..."
              echo "=============================================="
              cd "$TMPDIR"
              # Clean up generated artifacts so the archive stays small
              find mesa-panvk -name "*.o" -delete 2>/dev/null || true
              find mesa-panvk -name "*.a" -delete 2>/dev/null || true
              rm -rf mesa-panvk/build-bionic 2>/dev/null || true
              tar -czf /termux-out/source.tar.gz -C mesa-panvk .
              ls -lh /termux-out/source.tar.gz

              cd mesa-panvk

              # ── Build the shared library ──
              KBASE_COUNT=$(grep -c "kbase_kmod.c.o" build-bionic/build.ninja || true)
              PANTHOR_COUNT=$(grep -c "panthor_kmod.c.o" build-bionic/build.ninja || true)
              echo "kbase_kmod.c.o entries:   $KBASE_COUNT"
              echo "panthor_kmod.c.o entries: $PANTHOR_COUNT"

              ninja -C build-bionic -j$(nproc) \
                src/panfrost/vulkan/libvulkan_panfrost.so

              mkdir -p /termux-out/lib
              mkdir -p /termux-out/share/vulkan/icd.d

              cp build-bionic/src/panfrost/vulkan/libvulkan_panfrost.so \
                 /termux-out/lib/libvulkan_panfrost.so

              cat > /termux-out/share/vulkan/icd.d/panfrost_icd.aarch64.json <<JSON
              {
                  "ICD": {
                      "api_version": "1.4.354",
                      "library_arch": "64",
                      "library_path": "$PREFIX/lib/libvulkan_panfrost.so"
                  },
                  "file_format_version": "1.0.1"
              }
              JSON

              echo "=== /termux-out ==="
              find /termux-out -type f
              echo "=== sizes ==="
              ls -lh /termux-out/lib/ /termux-out/source.tar.gz
            '

      - name: Package tarball (${{ matrix.build-type }})
        run: |
          set -euo pipefail
          cd "termux-out-${{ matrix.build-type }}"
          TARBALL="panvk-termux-aarch64-${{ matrix.build-type }}-${{ needs.prepare.outputs.stamp }}.tar.gz"
          tar -czvf "../${TARBALL}" .
          ls -lh "../${TARBALL}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: panvk-termux-aarch64-${{ matrix.build-type }}-${{ needs.prepare.outputs.stamp }}
          path: |
            termux-out-${{ matrix.build-type }}/
            panvk-termux-aarch64-${{ matrix.build-type }}-${{ needs.prepare.outputs.stamp }}.tar.gz
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded files
        run: find artifacts -type f

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "${{ needs.prepare.outputs.tag }} — PanVK build ${{ needs.prepare.outputs.date }} ${{ needs.prepare.outputs.time }} UTC"
          body: |
            ## PanVK for Termux (aarch64, native build)

            Built natively inside Termux. Source merged with
            `mexicanbr0auth/mesa-panvk-g57@winlatormali-ci` for Mali-G57
            fixes, then `panvk-mali-g57-workaround.patch` applied on top.

            **Date (UTC):** `${{ needs.prepare.outputs.date }}`
            **Time (UTC):** `${{ needs.prepare.outputs.time }}`
            **Commit:** `${{ github.sha }}`
            **Build types:** `${{ needs.prepare.outputs.types }}`

            ### Files
            - `panvk-termux-aarch64-*.tar.gz` — driver + ICD
            - `source.tar.gz` — full patched source tree

            ### Install
            ```bash
            tar -xzf panvk-termux-aarch64-release-*.tar.gz -C $PREFIX
            export VK_ICD_FILENAMES=$PREFIX/share/vulkan/icd.d/panfrost_icd.aarch64.json
            ```
          files: |
            artifacts/*.tar.gz
            artifacts/**/libvulkan_panfrost.so
            artifacts/**/panfrost_icd.aarch64.json
            artifacts/**/source.tar.gz
          overwrite_files: true
          generate_release_notes: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
