name: release PanVK for Termux (aarch64, native)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        type: choice
        required: true
        default: both
        options:
          - both
          - debugoptimized
          - release
      release_tag:
        description: "Tag to create (leave empty to auto-generate)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      date:  ${{ steps.ts.outputs.date }}
      time:  ${{ steps.ts.outputs.time }}
      stamp: ${{ steps.ts.outputs.stamp }}
      tag:   ${{ steps.ts.outputs.tag }}
      types: ${{ steps.ts.outputs.types }}
    steps:
      - name: Compute build timestamp and tag
        id: ts
        run: |
          DATE=$(date -u +'%Y-%m-%d')
          TIME=$(date -u +'%H%M%S')
          STAMP="${DATE}-${TIME}"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "date=$DATE"           >> "$GITHUB_OUTPUT"
          echo "time=$TIME"           >> "$GITHUB_OUTPUT"
          echo "stamp=$STAMP"         >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${{ github.event.inputs.release_tag }}" ]]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="build-${DATE}-${TIME}-${SHORT_SHA}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          CHOICE="${{ github.event.inputs.build_type }}"
          case "$CHOICE" in
            release)        TYPES='["release"]' ;;
            debugoptimized) TYPES='["debugoptimized"]' ;;
            *)              TYPES='["debugoptimized","release"]' ;;
          esac
          echo "types=$TYPES" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        build-type: ${{ fromJSON(needs.prepare.outputs.types) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write Meson command generator
        run: |
          mkdir -p "${{ github.workspace }}/ci-scripts"
          cat > "${{ github.workspace }}/ci-scripts/gen_meson_cmd.py" << 'PYEOF'
          #!/usr/bin/env python3
          import os
          import re
          import sys
          from pathlib import Path

          options_file = None
          for name in ("meson.options", "meson_options.txt"):
              f = Path(name)
              if f.exists():
                  options_file = f
                  break

          if options_file is None:
              print("ERROR: no meson.options file found", file=sys.stderr)
              sys.exit(1)

          content = options_file.read_text()
          opts = sorted(set(re.findall(r"['\"]([a-zA-Z0-9_-]+)['\"]", content)))

          print(f">>> Options file: {options_file}", file=sys.stderr)
          print(f">>> Options found: {' '.join(opts)}", file=sys.stderr)

          build_type = os.environ.get("BUILD_TYPE", "debugoptimized")
          prefix = os.environ.get("PREFIX", "/data/data/com.termux/files/usr")

          args = [
              f"-Dbuildtype={build_type}",
              "-Dvulkan-drivers=panfrost",
              "-Dgallium-drivers=",
              "-Dplatforms=x11",
              "-Dglx=disabled",
              "-Degl=disabled",
              "-Dopengl=false",
              "-Dgles1=disabled",
              "-Dgles2=disabled",
              "-Dbuild-tests=false",
              "-Dlibunwind=disabled",
              "-Dvalgrind=disabled",
              "-Dperfetto=false",
              f"-Dprefix={prefix}",
              "-Dc_link_args=-landroid-shmem",
              "-Dcpp_link_args=-landroid-shmem",
          ]

          if "panfrost-kmds" in opts:
              args.append("-Dpanfrost-kmds=kbase,panthor")
              print(">>> Adding: -Dpanfrost-kmds=kbase,panthor", file=sys.stderr)

          if "panvk-use-kbase" in opts:
              args.append("-Dpanvk-use-kbase=true")
              print(">>> Adding: -Dpanvk-use-kbase=true", file=sys.stderr)

          if "spirv-tools" in opts:
              args.append("-Dspirv-tools=disabled")
              print(">>> Adding: -Dspirv-tools=disabled", file=sys.stderr)

          print("meson setup build-bionic \\")
          for i, a in enumerate(args):
              sep = "" if i == len(args) - 1 else " \\"
              print(f"  {a}{sep}")
          PYEOF
          chmod +x "${{ github.workspace }}/ci-scripts/gen_meson_cmd.py"

      - name: Build PanVK (${{ matrix.build-type }}) inside Termux container
        run: |
          set -euo pipefail

          mkdir -p "${{ github.workspace }}/out-${{ matrix.build-type }}"
          chmod 777 "${{ github.workspace }}/out-${{ matrix.build-type }}"

          docker run --rm \
            -v "${{ github.workspace }}/out-${{ matrix.build-type }}:/out" \
            -v "${{ github.workspace }}/ci-scripts:/ci-scripts:ro" \
            termux/termux-docker:aarch64 \
            bash -c '
              set -euo pipefail
              export TMPDIR="${TMPDIR:-$PREFIX/tmp}"
              export BUILD_TYPE="'"${{ matrix.build-type }}"'"

              mkdir -p "$TMPDIR"

              mkdir -p "$PREFIX/etc/apt/sources.list.d"
              echo "deb https://packages.termux.dev/apt/termux-main stable main" \
                > "$PREFIX/etc/apt/sources.list.d/termux-main.list"

              for i in 1 2 3; do
                if pkg update -y; then break; fi
                sleep 10
                if [[ $i -eq 3 ]]; then exit 1; fi
              done

              pkg install -y x11-repo tur-repo
              pkg update -y || true

              pkg install -y \
                git clang lld ninja python python-pip pkg-config \
                bison flex cmake glslang shaderc vulkan-headers \
                vulkan-loader-generic libandroid-shmem libdrm libxcb \
                xorgproto libx11 libxshmfence zlib zstd libexpat \
                libclc spirv-llvm-translator libxrandr libxrandr-static file \
                patch

              pip install --break-system-packages \
                meson mako pyyaml packaging ply setuptools

              cd "$TMPDIR"
              rm -rf mesa-panvk
              git clone --depth 1 https://github.com/xodiosx/mesa-funnymdz-leegao.git mesa-panvk
              cd mesa-panvk

              echo "=============================================="
              echo "Fetching winlatormali-ci reference tree ..."
              echo "=============================================="
              REF_DIR="$TMPDIR/winlatormali-ref"
              rm -rf "$REF_DIR"
              git clone --depth 1 \
                --branch winlatormali-ci \
                https://github.com/mexicanbr0auth/mesa-panvk-g57.git \
                "$REF_DIR"

              echo "=============================================="
              echo "Overlaying winlatormali-ci (full tree) ..."
              echo "=============================================="
              (
                cd "$REF_DIR"
                find . -type f \
                  -not -path "./.git/*" \
                  -not -path "./.github/*" \
                  -not -path "./build*/*" \
                  -not -path "./subprojects/*" \
                  -print
              ) | while read -r f; do
                rel="${f#./}"
                mkdir -p "$(dirname "$rel")"
                cp -a "$REF_DIR/$rel" "$rel"
              done
              echo "Overlay done."

              echo "=============================================="
              echo "Discovering *.patch files in repo root ..."
              echo "=============================================="

              PATCHES=()
              while IFS= read -r f; do
                [[ -n "$f" ]] && PATCHES+=("$f")
              done < <(find . -maxdepth 1 -name "*.patch" -type f -print | sort)

              if [[ ${#PATCHES[@]} -eq 0 ]]; then
                echo ">>> No .patch files found in repo root; nothing to apply."
              else
                echo ">>> Found ${#PATCHES[@]} patch file(s):"
                for p in "${PATCHES[@]}"; do
                  echo "    - $p"
                done
                echo

                for p in "${PATCHES[@]}"; do
                  echo "----------------------------------------------"
                  echo ">>> Applying: $p"
                  echo "----------------------------------------------"

                  if git apply --check "$p" 2>/dev/null; then
                    echo "    strategy: git apply (clean)"
                    if git apply --verbose "$p"; then
                      echo "    result:   applied"
                    else
                      echo "    result:   git apply failed after --check passed (unexpected)"
                      echo "    fallback: patch -p1 --forward"
                      patch -p1 --forward --no-backup-if-mismatch < "$p" || true
                    fi
                  else
                    echo "    strategy: patch -p1 --forward (git apply check failed)"
                    patch -p1 --forward --no-backup-if-mismatch < "$p" || true
                    echo "    result:   partial-or-full (see log above for which hunks applied)"
                  fi
                  echo
                done
              fi

              echo "=============================================="
              echo "Reject files after patching ..."
              echo "=============================================="
              find . -name "*.rej" -print || true
              echo "=============================================="
              echo "End reject files."
              echo "=============================================="

              MESON_SH="$TMPDIR/meson_cmd.sh"
              rm -f "$MESON_SH"
              python3 /ci-scripts/gen_meson_cmd.py > "$MESON_SH"
              cat "$MESON_SH"
              bash "$MESON_SH"

              echo "=============================================="
              echo "Archiving source tree (compact) ..."
              echo "=============================================="
              # --exclude-vcs removes .git, .gitignore, .gitmodules, etc.
              # Also drop .github, build dirs, subproject caches, and any
              # patch leftovers so the archive is genuinely source-only.
              tar -czf /out/source.tar.gz \
                --exclude-vcs \
                --exclude="./.github" \
                --exclude="./build-bionic" \
                --exclude="./build-host" \
                --exclude="./build-*" \
                --exclude="./subprojects/packagecache" \
                --exclude="./subprojects/*/packagecache" \
                --exclude="*.rej" \
                --exclude="*.orig" \
                --exclude="*.bak" \
                --exclude="*.o" \
                --exclude="*.a" \
                -C "$TMPDIR/mesa-panvk" \
                .
              ls -lh /out/source.tar.gz
              echo "Source archive contents (top level):"
              tar -tzf /out/source.tar.gz | head -20
              echo "Total entries:"
              tar -tzf /out/source.tar.gz | wc -l

              echo "=============================================="
              echo "Building PanVK ..."
              echo "=============================================="
              ninja -C build-bionic -j$(nproc) \
                src/panfrost/vulkan/libvulkan_panfrost.so

              echo "=============================================="
              echo "Packaging driver files ..."
              echo "=============================================="
              mkdir -p /out/driver/lib
              mkdir -p /out/driver/share/vulkan/icd.d

              cp build-bionic/src/panfrost/vulkan/libvulkan_panfrost.so \
                 /out/driver/lib/libvulkan_panfrost.so

              cat > /out/driver/share/vulkan/icd.d/panfrost_icd.aarch64.json <<JSON
              {
                  "ICD": {
                      "api_version": "1.4.354",
                      "library_arch": "64",
                      "library_path": "$PREFIX/lib/libvulkan_panfrost.so"
                  },
                  "file_format_version": "1.0.1"
              }
              JSON

              echo "=== /out ==="
              find /out -type f
              echo "=== sizes ==="
              ls -lh /out/source.tar.gz /out/driver/lib/
            '

      - name: Package driver tarball (${{ matrix.build-type }})
        run: |
          set -euo pipefail
          cd "${{ github.workspace }}/out-${{ matrix.build-type }}"

          # Driver bundle: lib/ + share/ only
          DRIVER_TARBALL="panvk-termux-aarch64-${{ matrix.build-type }}-${{ needs.prepare.outputs.stamp }}.tar.gz"
          tar -czvf "../${DRIVER_TARBALL}" driver/

          echo "=== Final artifacts ==="
          ls -lh "../${DRIVER_TARBALL}" source.tar.gz

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: panvk-source-${{ matrix.build-type }}-${{ needs.prepare.outputs.stamp }}
          path: out-${{ matrix.build-type }}/source.tar.gz
          if-no-files-found: error

      - name: Upload driver archive
        uses: actions/upload-artifact@v4
        with:
          name: panvk-driver-${{ matrix.build-type }}-${{ needs.prepare.outputs.stamp }}
          path: panvk-termux-aarch64-${{ matrix.build-type }}-${{ needs.prepare.outputs.stamp }}.tar.gz
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded files
        run: find artifacts -type f -exec ls -lh {} \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "${{ needs.prepare.outputs.tag }} -- PanVK build ${{ needs.prepare.outputs.date }} ${{ needs.prepare.outputs.time }} UTC"
          body: |
            ## PanVK for Termux (aarch64, native build)

            Source overlaid from
            `mexicanbr0auth/mesa-panvk-g57@winlatormali-ci`.
            All `*.patch` files in the repo root applied on top.

            **Date (UTC):** `${{ needs.prepare.outputs.date }}`
            **Time (UTC):** `${{ needs.prepare.outputs.time }}`
            **Commit:** `${{ github.sha }}`
            **Build types:** `${{ needs.prepare.outputs.types }}`

            ### File layout

            | File | Contents |
            |------|----------|
            | `panvk-termux-aarch64-<type>-<stamp>.tar.gz` | Driver only: `driver/lib/libvulkan_panfrost.so` + `driver/share/vulkan/icd.d/panfrost_icd.aarch64.json` |
            | `source.tar.gz` | Patched Mesa source tree (per build type) |

            ### Install (Termux)
            ```bash
            # driver
            tar -xzf panvk-termux-aarch64-release-*.tar.gz
            cp -r driver/lib/*          $PREFIX/lib/
            cp -r driver/share/vulkan   $PREFIX/share/

            # or use the files in-place:
            export VK_ICD_FILENAMES=$PREFIX/share/vulkan/icd.d/panfrost_icd.aarch64.json
            ```
          files: |
            artifacts/panvk-termux-aarch64-*.tar.gz
            artifacts/source.tar.gz
          overwrite_files: true
          generate_release_notes: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
