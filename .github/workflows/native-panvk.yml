name: release PanVK + Zink for winlator (aarch64, native)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build type"
        type: choice
        required: true
        default: both
        options:
          - both
          - debugoptimized
          - release
      release_tag:
        description: "Tag to create (leave empty to auto-generate)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      date:  ${{ steps.ts.outputs.date }}
      time:  ${{ steps.ts.outputs.time }}
      stamp: ${{ steps.ts.outputs.stamp }}
      tag:   ${{ steps.ts.outputs.tag }}
      types: ${{ steps.ts.outputs.types }}
    steps:
      - name: Compute build timestamp and tag
        id: ts
        run: |
          DATE=$(date -u +'%Y-%m-%d')
          TIME=$(date -u +'%H%M%S')
          STAMP="${DATE}-${TIME}"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "date=$DATE"           >> "$GITHUB_OUTPUT"
          echo "time=$TIME"           >> "$GITHUB_OUTPUT"
          echo "stamp=$STAMP"         >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${{ github.event.inputs.release_tag }}" ]]; then
            TAG="${{ github.event.inputs.release_tag }}"
          else
            TAG="build-${DATE}-${TIME}-${SHORT_SHA}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          CHOICE="${{ github.event.inputs.build_type }}"
          case "$CHOICE" in
            release)        TYPES='["release"]' ;;
            debugoptimized) TYPES='["debugoptimized"]' ;;
            *)              TYPES='["debugoptimized","release"]' ;;
          esac
          echo "types=$TYPES" >> "$GITHUB_OUTPUT"

  prepare-winlator-branch:
    needs: [prepare]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BASE_REPO: "xodiosx/mesa-panvk-mali-g57"
      WINLATOR_REPO: "Mateus-tokokudo/mesa-funnymdzz"
      WINLATOR_BRANCH: "winlatormali-ci"
      TARGET_BRANCH: "winlator"
    steps:
      - name: Checkout (for push credentials)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git credentials
        run: |
          set -euo pipefail
          git config --local user.email "github-actions@users.noreply.github.com"
          git config --local user.name  "github-actions"
          git remote set-url origin \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git remote -v

      - name: Write patcher script
        run: |
          mkdir -p "${{ github.workspace }}/ci-scripts"
          cat > "${{ github.workspace }}/ci-scripts/patch_panvkdbg.py" << 'PYEOF'
          #!/usr/bin/env python3
          """
          Source-tree transformations applied before compilation.

          1. Neutralize every `fprintf(stderr, "PANVKDBG ...")` statement
             by replacing the call with `(void)0`.

          2. Rename the PanVK Vulkan driver name to "panvcake".

          3. Change the Vulkan driver ID reported by PanVK from
             VK_DRIVER_ID_MESA_PANVK to a custom value.
          """
          import re
          import sys
          from pathlib import Path

          ROOTS = [Path("src/panfrost"), Path("src/vulkan")]

          REWRAP_RE = re.compile(
              r'if\s*\(\s*0\s*\)\s*(?=fprintf\s*\(\s*stderr\s*,\s*"PANVKDBG)'
          )
          START_RE = re.compile(
              r'fprintf\s*\(\s*stderr\s*,\s*(?="PANVKDBG)'
          )

          CUSTOM_DRIVER_ID = "((VkDriverId)0x0000CAFE)"
          DRIVER_ID_RE = re.compile(r'\bVK_DRIVER_ID_MESA_PANVK\b')

          DRIVER_NAME_PATTERNS = [
              (re.compile(r'"Mesa PanVK"'), '"PanVCake"'),
              (re.compile(r'"PanVK"'),      '"PanVCake"'),
              (re.compile(r'"panvk"'),      '"panvcake"'),
          ]

          def _find_close_paren(src, open_paren_idx):
              depth = 0
              i = open_paren_idx
              in_str = False
              in_chr = False
              while i < len(src):
                  c = src[i]
                  if in_str:
                      if c == "\\":
                          i += 2
                          continue
                      if c == '"':
                          in_str = False
                  elif in_chr:
                      if c == "\\":
                          i += 2
                          continue
                      if c == "'":
                          in_chr = False
                  else:
                      if c == '"':
                          in_str = True
                      elif c == "'":
                          in_chr = True
                      elif c == "(":
                          depth += 1
                      elif c == ")":
                          depth -= 1
                          if depth == 0:
                              return i + 1
                  i += 1
              return None

          def silence_fprintf(src):
              src = REWRAP_RE.sub("", src)
              out = []
              i = 0
              count = 0
              while i < len(src):
                  idx = src.find("fprintf", i)
                  if idx == -1:
                      out.append(src[i:])
                      break
                  m = START_RE.match(src, idx)
                  if not m:
                      out.append(src[i:idx + len("fprintf")])
                      i = idx + len("fprintf")
                      continue
                  open_paren = src.find("(", m.start())
                  close_paren = _find_close_paren(src, open_paren)
                  if close_paren is None:
                      out.append(src[i:])
                      break
                  out.append(src[i:idx])
                  out.append("(void)0")
                  i = close_paren
                  count += 1
              return "".join(out), count

          def rename_driver(src):
              n_name = 0
              n_id = 0
              for pat, repl in DRIVER_NAME_PATTERNS:
                  src, k = pat.subn(repl, src)
                  n_name += k
              src, k = DRIVER_ID_RE.subn(CUSTOM_DRIVER_ID, src)
              n_id += k
              return src, n_name, n_id

          def main():
              for root in ROOTS:
                  if not root.exists():
                      print(f"ERROR: {root} not found", file=sys.stderr)
                      return 1
              total_neutralized = 0
              total_names = 0
              total_ids = 0
              files_modified = 0
              for root in ROOTS:
                  for path in sorted(root.rglob("*")):
                      if path.suffix not in (".c", ".h", ".cpp", ".cc",
                                             ".cxx", ".hpp"):
                          continue
                      try:
                          src = path.read_text()
                      except UnicodeDecodeError:
                          continue
                      orig = src
                      if '"PANVKDBG' in src:
                          src, n = silence_fprintf(src)
                          if n:
                              print(f"{path}: neutralized {n} PANVKDBG call(s)")
                              total_neutralized += n
                      before = src
                      src, n_name, n_id = rename_driver(src)
                      if src != before:
                          if n_name or n_id:
                              print(f"{path}: driver rename "
                                    f"({n_name} name, {n_id} id)")
                              total_names += n_name
                              total_ids += n_id
                      if src != orig:
                          path.write_text(src)
                          files_modified += 1
              print()
              print(f"Files modified:                   {files_modified}")
              print(f"PANVKDBG calls neutralized:       {total_neutralized}")
              print(f"Driver-name strings renamed:      {total_names}")
              print(f"Driver-ID occurrences replaced:   {total_ids}")
              return 0

          if __name__ == "__main__":
              sys.exit(main())
          PYEOF
          chmod +x "${{ github.workspace }}/ci-scripts/patch_panvkdbg.py"
          echo "--- wrote ci-scripts/patch_panvkdbg.py ---"
          wc -l "${{ github.workspace }}/ci-scripts/patch_panvkdbg.py"

      - name: Clone base + winlatormali-ci
        run: |
          set -euo pipefail
          rm -rf /tmp/base /tmp/winlator-src

          echo "==== cloning base: $BASE_REPO ===="
          git clone --depth 1 "https://github.com/$BASE_REPO.git" /tmp/base

          echo "==== cloning $WINLATOR_REPO @ $WINLATOR_BRANCH ===="
          git clone --depth 1 --branch "$WINLATOR_BRANCH" \
            "https://github.com/$WINLATOR_REPO.git" /tmp/winlator-src

          rm -rf /tmp/base/.git /tmp/winlator-src/.git

          echo "==== base top-level ===="
          ls -A /tmp/base | head -40
          echo "==== winlator-src top-level ===="
          ls -A /tmp/winlator-src | head -40

      - name: Copy missing files from winlatormali-ci into base
        run: |
          set -euo pipefail
          cd /tmp/winlator-src

          echo "=============================================="
          echo "Files present only in winlatormali-ci:"
          echo "=============================================="
          COUNT=0
          while IFS= read -r rel; do
            rel="${rel#./}"
            [[ -z "$rel" ]] && continue
            [[ "$rel" == ".git"* ]] && continue

            dest="/tmp/base/$rel"
            if [[ -e "$dest" ]]; then
              # Exists in base — will be handled by the normal patch.
              continue
            fi

            mkdir -p "$(dirname "$dest")"
            cp -a "/tmp/winlator-src/$rel" "$dest"
            echo "  + $rel"
            COUNT=$((COUNT + 1))
          done < <(find . -type f -print | sort)

          echo
          echo "Total new files copied: $COUNT"

      - name: Generate patch (base → winlatormali-ci) and apply
        run: |
          set -euo pipefail
          cd /tmp

          # Now that missing files have been copied, the diff contains only
          # differences on files that exist in BOTH trees. New files are
          # already in place and therefore identical in both trees.
          diff -ruN \
            --exclude='.git' \
            base winlator-src > /tmp/winlator.patch || true

          ls -lh /tmp/winlator.patch
          echo "---- first 80 lines of patch ----"
          head -80 /tmp/winlator.patch || true
          echo "----------------------------------"

          cd /tmp/base
          if [[ -s /tmp/winlator.patch ]]; then
            if patch -p1 --batch --forward < /tmp/winlator.patch; then
              echo ">>> patch applied cleanly onto base"
            else
              echo ">>> patch reported rejects; listing .rej files:"
              find . -name '*.rej' -print || true
            fi
          else
            echo ">>> patch is empty — no differences on common files"
          fi

          mkdir -p "$GITHUB_WORKSPACE/winlator-patch"
          cp /tmp/winlator.patch "$GITHUB_WORKSPACE/winlator-patch/"

      - name: Apply python patcher
        run: |
          set -euo pipefail
          cd /tmp/base
          python3 "$GITHUB_WORKSPACE/ci-scripts/patch_panvkdbg.py"

      - name: Restore executable bits
        run: |
          set -euo pipefail
          cd /tmp/base
          while IFS= read -r f; do
            case "$f" in
              *.sh|*.bash|*.py|*.pl|*.rb|*.zsh)
                chmod +x "$f" || true
                ;;
            esac
          done < <(find . -type f -print)

      - name: Commit and force-push to winlator branch
        run: |
          set -euo pipefail
          cd /tmp/base

          git init -q -b "$TARGET_BRANCH"
          git config user.email "github-actions@users.noreply.github.com"
          git config user.name  "github-actions"
          git add -A
          git commit -q -m "winlator: mixed source $(date -u +%Y%m%d-%H%M%S)"

          git --no-pager log -1 --oneline
          git --no-pager diff --stat HEAD~1 2>/dev/null | tail -20 || true

          git remote add origin \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"

          echo ">>> force-pushing to origin/$TARGET_BRANCH"
          git push --force origin "$TARGET_BRANCH"
          echo ">>> push done"

      - name: Upload winlator.patch artifact
        uses: actions/upload-artifact@v4
        with:
          name: winlator-source-patch-${{ needs.prepare.outputs.stamp }}
          path: ${{ github.workspace }}/winlator-patch/winlator.patch
          if-no-files-found: warn

  build:
    needs: [prepare, prepare-winlator-branch]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        build-type: ${{ fromJSON(needs.prepare.outputs.types) }}

    steps:
      - name: Checkout winlator branch
        uses: actions/checkout@v4
        with:
          ref: winlator
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Report checked-out commit
        run: |
          set -euo pipefail
          git --no-pager log -1 --oneline
          echo "---- workspace top ----"
          ls -A | head -40

      - name: Build PanVK + Zink (${{ matrix.build-type }}) inside Termux container
        run: |
          set -euo pipefail

          mkdir -p "${{ github.workspace }}/termux-out-${{ matrix.build-type }}"
          chmod 777 "${{ github.workspace }}/termux-out-${{ matrix.build-type }}"

          docker run --rm \
            -v "${{ github.workspace }}:/src:ro" \
            -v "${{ github.workspace }}/termux-out-${{ matrix.build-type }}:/termux-out" \
            termux/termux-docker:aarch64 \
            bash -c '
              set -euo pipefail
              export TMPDIR="${TMPDIR:-$PREFIX/tmp}"
              export BUILD_TYPE="'"${{ matrix.build-type }}"'"

              mkdir -p "$PREFIX/etc/apt/sources.list.d"
              echo "deb https://packages.termux.dev/apt/termux-main stable main" \
                > "$PREFIX/etc/apt/sources.list.d/termux-main.list"

              for i in 1 2 3; do
                if pkg update -y; then break; fi
                echo "pkg update attempt $i failed, retrying in 10s..."
                sleep 10
                if [[ $i -eq 3 ]]; then
                  echo "pkg update failed after 3 attempts" >&2
                  exit 1
                fi
              done

              pkg install -y x11-repo tur-repo
              pkg update -y || true

              pkg install -y \
                git clang lld binutils cmake autoconf automake libtool make python python-pip ninja llvm bison flex pkg-config \
                fontconfig freetype gnutls libgnutls libgmp \
                libandroid-shmem libandroid-shmem-static libandroid-spawn \
                libx11 xorgproto libdrm libpixman libjpeg-turbo xtrans libxxf86vm xorg-xrandr \
                xorg-font-util xorg-util-macros libxfont2 libxkbfile libpciaccess \
                xcb-util-renderutil xcb-util-image xcb-util-keysyms xcb-util-wm \
                xorg-xkbcomp xkeyboard-config libxdamage libxinerama libxshmfence \
                libxcb libxcomposite libxcursor libxfixes libxrender \
                glslang shaderc vulkan-headers vulkan-loader-generic vulkan-tools \
                libclc spirv-llvm-translator zlib zstd libexpat \
                libxrandr libxrandr-static mesa-demos osmesa \
                pulseaudio termux-x11-nightly patch file perl mesa-dev libglvnd-dev libglvnd

              pip install --break-system-packages meson mako pyyaml packaging setuptools

              mkdir -p "$TMPDIR"
              cd "$TMPDIR"
              rm -rf mesa-panvk
              cp -a /src mesa-panvk
              cd mesa-panvk

              rm -rf .github ci-scripts winlator-patch termux-out-* build-bionic build-host || true

              echo "==== source tree top ===="
              ls -A | head -40

              RESIDUAL=$(grep -r "\"PANVKDBG" src/panfrost/ | wc -l || true)
              echo "Residual \"PANVKDBG literals in source tree: $RESIDUAL"

              meson setup build-bionic \
                -Dbuildtype="$BUILD_TYPE" \
                -Dpanvk-use-kbase=true \
                -Dvulkan-drivers=panfrost \
                -Dgallium-drivers=zink \
                -Dplatforms=x11 \
                -Ddebug=false \
                -Dstrip=true \
                -Dbuild-tests=false \
                -Dc_link_args=-landroid-shmem \
                -Dcpp_link_args=-landroid-shmem \
                -Dpanfrost-kmds=kbase,panthor \
                -Dopengl=true \
                -Dgles2=enabled \
                -Degl=enabled \
                -Dglx=disabled \
                -Dgbm=disabled \
                -Dshared-glapi=enabled \
                -Dlibunwind=disabled \
                -Dvalgrind=disabled \
                -Dperfetto=false \
                -Dprefix="$PREFIX"

              ninja -C build-bionic -j$(nproc)

              SO_STRINGS=$(strings build-bionic/src/panfrost/vulkan/libvulkan_panfrost.so \
                             | grep -c "^PANVKDBG" || true)
              echo "PANVKDBG strings in freshly built panvk .so: $SO_STRINGS"

              mkdir -p /termux-out/lib
              mkdir -p /termux-out/share/vulkan/icd.d

              while IFS= read -r so; do
                cp -a "$so" /termux-out/lib/
              done < <(find build-bionic \( -name "*.so" -o -name "*.so.*" \) -type f)

              while IFS= read -r so; do
                target=$(readlink "$so" || true)
                if [[ -n "$target" ]]; then
                  cp -a "$so" /termux-out/lib/ 2>/dev/null || true
                fi
              done < <(find build-bionic \( -name "*.so" -o -name "*.so.*" \) -type l)

              for f in \
                build-bionic/src/panfrost/vulkan/libvulkan_panfrost.so \
                build-bionic/src/gallium/targets/dri/libgallium_dri.so \
                build-bionic/src/egl/libEGL.so \
                build-bionic/src/gallium/targets/egl/libEGL_mesa.so \
                build-bionic/src/mapi/shared-glapi/libglapi.so \
                build-bionic/src/glx/libGLX_mesa.so
              do
                [[ -e "$f" ]] && cp -a "$f" /termux-out/lib/ || true
              done

              cat > /termux-out/share/vulkan/icd.d/panfrost_icd.aarch64.json <<JSON
              {
                  "ICD": {
                      "api_version": "1.4.354",
                      "library_arch": "64",
                      "library_path": "$PREFIX/lib/libvulkan_panfrost.so"
                  },
                  "file_format_version": "1.0.1"
              }
              JSON

              echo "=== /termux-out tree ==="
              find /termux-out -type f -o -type l | sort
              echo "=== sizes ==="
              ls -lh /termux-out/lib/
            '

      - name: Package tarball (${{ matrix.build-type }})
        run: |
          set -euo pipefail
          cd "termux-out-${{ matrix.build-type }}"
          TARBALL="panvk-zink-termux-aarch64-${{ matrix.build-type }}-${{ needs.prepare.outputs.stamp }}.tar.gz"
          tar -czvf "../${TARBALL}" lib/ share/
          ls -lh "../${TARBALL}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: panvk-zink-termux-aarch64-${{ matrix.build-type }}-${{ needs.prepare.outputs.stamp }}
          path: |
            termux-out-${{ matrix.build-type }}/
            panvk-zink-termux-aarch64-${{ matrix.build-type }}-${{ needs.prepare.outputs.stamp }}.tar.gz
          if-no-files-found: error

  release:
    needs: [prepare, prepare-winlator-branch, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List downloaded files
        run: find artifacts -type f -exec ls -lh {} \;

      - name: Drop empty artifact files
        run: |
          find artifacts -type f -empty -print -delete || true
          find artifacts -type f -exec ls -lh {} \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: "${{ needs.prepare.outputs.tag }} — PanVK + Zink for Termux ${{ needs.prepare.outputs.date }} ${{ needs.prepare.outputs.time }} UTC"
          body: |
            ## PanVK + Zink for Termux (aarch64, native build)

            Built natively inside Termux (`termux/termux-docker:aarch64`)
            on `ubuntu-24.04-arm`.

            **Build date (UTC):** `${{ needs.prepare.outputs.date }}`
            **Build time (UTC):** `${{ needs.prepare.outputs.time }}`
            **Commit:** `${{ github.sha }}`
            **Build types:** `${{ needs.prepare.outputs.types }}`

            ### Source provenance
            Built from the `winlator` branch, generated by:
            - Cloning base repo `xodiosx/mesa-panvk-mali-g57`
            - Cloning `winlatormali-ci` from `Mateus-tokokudo/mesa-funnymdzz`
            - Copying files that exist only in `winlatormali-ci` into base
              (workflow scripts, CI assets, etc.)
            - Patching files that exist in both trees with the diff
            - Applying PANVKDBG neutralizer + driver rename patcher

            The pre-patch diff is attached as `winlator.patch`.

            ### What is included
            - **PanVK** — Vulkan driver for Mali-G57 (Valhall JM) via kbase
            - **Zink** — Gallium driver for OpenGL/GLES on top of Vulkan.

            ### Customizations
            - PANVKDBG debug statements neutralized at the source level.
            - PanVK driver name reported in
              `VkPhysicalDeviceDriverProperties::driverName` is `panvcake`.
            - PanVK driver ID changed to `(VkDriverId)0x0000CAFE`.

            ### Files
            - `panvk-zink-termux-aarch64-debugoptimized-*.tar.gz`
            - `panvk-zink-termux-aarch64-release-*.tar.gz`
            - `libvulkan_panfrost.so` — PanVK Vulkan driver
            - `libgallium_dri.so` — contains the Zink Gallium driver
            - `panfrost_icd.aarch64.json` — ICD manifest
            - `winlator.patch` — diff of files present in both trees
          files: |
            artifacts/*.tar.gz
            artifacts/**/libvulkan_panfrost.so
            artifacts/**/libgallium_dri.so
            artifacts/**/panfrost_icd.aarch64.json
            artifacts/**/winlator.patch
          overwrite_files: true
          generate_release_notes: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
